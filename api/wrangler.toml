name = "pandas-drills-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Logs and observability stay off: the API must not keep request bodies, headers or IPs.
[observability]
enabled = false

[observability.logs]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "pandas-drills"
# Local dev and the tests do not need a real id. Replace it with the id printed by
# `wrangler d1 create pandas-drills` before deploying (see README.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
