name = "pandas-drills-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Logs and observability stay off: the API must not keep request bodies, headers or IPs.
[observability]
enabled = false

[observability.logs]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "pandas-drills"
database_id = "6c9fd931-5574-4a4f-b516-6495e5280462"
migrations_dir = "migrations"

# One daily cleanup of expired classes (03:17 UTC). The same cleanup also runs, in small
# chunks, when a class is created or joined and when a report is opened.
[triggers]
crons = ["17 3 * * *"]
